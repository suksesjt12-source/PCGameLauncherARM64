name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "docs/**"
      - "*.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - ".github/workflows/android.yml"

concurrency:
  group: pcgl-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Checkout Box64 upstream
        uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          ref: 27c8275d8295f521bb40faf920788ac5116dbfb0
          path: third_party/box64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Box64 for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake make python3 libzydis-dev p7zip-full g++-mingw-w64-x86-64

          git clone https://github.com/termux/termux-docker.git third_party/termux-docker
          git -C third_party/termux-docker checkout 148b93d989cbc572719e050135b3e13f115f2a8e~1
          sudo cp -rf third_party/termux-docker/system/arm /system
          sudo chown -R "$(whoami):$(whoami)" /system
          sudo chmod 755 -R /system

          NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          test -x "$CC"

          cmake -S third_party/box64 -B third_party/box64/build \
            -DCMAKE_C_COMPILER="$CC" \
            -DTERMUX=0 \
            -DANDROID=1 \
            -DARM_DYNAREC=1 \
            -DBAD_SIGNAL=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DHAVE_TRACE=0 \
            -DZYDIS3=0 \
            -DSTATICBUILD=0 \
            -DBOX32=0 \
            -DCI=0

          cmake --build third_party/box64/build --parallel 2
          BOX64_BIN="third_party/box64/build/box64"
          test -s "$BOX64_BIN"
          file "$BOX64_BIN"
          readelf -h "$BOX64_BIN" | grep -q "AArch64"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 "$BOX64_BIN" app/src/main/jniLibs/arm64-v8a/libbox64.so

      - name: Build Windows input helper for Wine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -static -static-libgcc -static-libstdc++ \
            tools/pcgl-input-bridge.cpp -lws2_32 -luser32 \
            -o app/src/main/assets/pcgl-input-bridge.exe
          file app/src/main/assets/pcgl-input-bridge.exe
          x86_64-w64-mingw32-objdump -f app/src/main/assets/pcgl-input-bridge.exe | grep -q 'pei-x86-64'
          test -s app/src/main/assets/pcgl-input-bridge.exe

          x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -static -static-libgcc -static-libstdc++ \
            -mwindows tools/pcgl-display-test.cpp -lgdi32 -luser32 \
            -o app/src/main/assets/pcgl-display-test.exe
          file app/src/main/assets/pcgl-display-test.exe
          x86_64-w64-mingw32-objdump -f app/src/main/assets/pcgl-display-test.exe | grep -q 'pei-x86-64'
          test -s app/src/main/assets/pcgl-display-test.exe

      - name: Run X11 protocol codec unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify Box64 is packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verify
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libbox64.so > .verify/libbox64.so
          test -s .verify/libbox64.so
          file .verify/libbox64.so
          readelf -h .verify/libbox64.so | grep -q "AArch64"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/pcgl-input-bridge.exe > .verify/pcgl-input-bridge.exe
          test -s .verify/pcgl-input-bridge.exe
          file .verify/pcgl-input-bridge.exe | grep -q 'PE32+.*x86-64'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/pcgl-display-test.exe > .verify/pcgl-display-test.exe
          test -s .verify/pcgl-display-test.exe
          file .verify/pcgl-display-test.exe | grep -q 'PE32+.*x86-64'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCGameLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
